name: Build and Release

on:
  push:
    branches: [ main, feature/install ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify npm is installed
        run: |
          npm --version
          node --version

      - name: Install pnpm globally
        run: npm install -g pnpm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller

      - name: Build Project
        env:
          SECRET_KEY: 'github-actions-build-secret'
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: 'backend.settings'
        run: python scripts/build_executable.py

      - name: Verify Executable Exists
        run: |
          if (Test-Path ./dist/IseoGraphApp.exe) {
            Write-Host "Executable found at ./dist/IseoGraphApp.exe"
            Get-Item ./dist/IseoGraphApp.exe | ForEach-Object {
              Write-Host "File size: $($_.Length / 1MB) MB"
            }
          } else {
            Write-Host "ERROR: Executable not found at expected location"
            Get-ChildItem ./dist -Recurse -File
            exit 1
          }

      - name: Zip Executable
        run: |
          Compress-Archive -Path ./dist/IseoGraphApp.exe -DestinationPath ./IseoGraph.zip
          Get-Item ./IseoGraph.zip | ForEach-Object {
            Write-Host "Zip file size: $($_.Length / 1MB) MB"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IseoGraph-Executable
          path: IseoGraph.zip
          retention-days: 30

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ github.ref_name }}-${{ github.run_number }}
          release_name: Release for ${{ github.ref_name }} #${{ github.run_number }}
          draft: false
          prerelease: false
          body: |
            IseoGraph executable build
            
            **Build Information:**
            - Branch: ${{ github.ref_name }}
            - Run: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            
            **Contents:**
            - IseoGraphApp.exe - Main application executable

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./IseoGraph.zip
          asset_name: IseoGraph.zip
          asset_content_type: application/zip

